<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大坡池水生生物圖鑑</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:      #2c5f3f;
      --primary-mid:  #3d7a52;
      --primary-pale: #e8f2ec;
      --warm:         #8b7355;
      --page-bg:      #f6f4ef;
      --card-bg:      #ffffff;
      --border:       #d4e0d8;
      --text:         #1e2e24;
      --text-sec:     #4a6355;
      --text-muted:   #7a9485;

      --nat-dark:  #2c5f3f; --nat-light: #e4f0e9; --nat-text: #1e4a2e;
      --int-dark:  #7a5c14; --int-light: #f5edda; --int-text: #6b4e0e;
      --inv-dark:  #7c2e18; --inv-light: #f7ebe7; --inv-text: #6b2410;
      --end-dark:  #3a5c18; --end-light: #e8f2db; --end-text: #2e4a10;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'PingFang TC', sans-serif;
      background: var(--page-bg);
      color: var(--text);
      line-height: 1.6;
    }

    /* ── Hero Banner ── */
    .hero {
      position: relative;
      height: 220px;
      background-color: var(--primary);
      background-image: url('banner.jpg');
      background-size: cover;
      background-position: center 40%;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
    }
    @media (min-width: 600px)  { .hero { height: 300px; } }
    @media (min-width: 900px)  { .hero { height: 400px; } }

    .hero-overlay {
      width: 100%;
      padding: 1.5rem 1.25rem 1.5rem;
      background: linear-gradient(to top, rgba(14,36,22,0.82) 0%, rgba(14,36,22,0.08) 100%);
      color: white;
    }
    @media (min-width: 600px) { .hero-overlay { padding: 2rem 2rem; } }

    .hero-eyebrow {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.65);
      margin-bottom: 6px;
    }
    .hero-title {
      font-size: clamp(22px, 5vw, 38px);
      font-weight: 500;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }
    .hero-sub {
      font-size: 13px;
      color: rgba(255,255,255,0.75);
    }

    /* ── Intro ── */
    .intro {
      background: var(--primary);
      color: rgba(255,255,255,0.82);
      padding: 0.85rem 1.25rem;
      font-size: 13.5px;
      text-align: center;
      line-height: 1.8;
    }
    @media (min-width: 600px) { .intro { padding: 1rem 2rem; } }

    /* ── Filter Bar ── */
    .filter-bar {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 0.6rem 1rem;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 2px 10px rgba(30,46,36,0.07);
    }

    .filter-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-bottom: 5px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .filter-row:last-child { margin-bottom: 0; }
    .filter-row::-webkit-scrollbar { display: none; }

    .filter-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .fbtn {
      font-size: 12px;
      padding: 5px 13px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: white;
      color: var(--text-sec);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .fbtn:hover  { background: var(--primary-pale); border-color: var(--primary-mid); color: var(--primary); }
    .fbtn.on     { background: var(--primary); color: white; border-color: var(--primary); }
    .fbtn.on-int { background: var(--int-dark); color: white; border-color: var(--int-dark); }
    .fbtn.on-inv { background: var(--inv-dark); color: white; border-color: var(--inv-dark); }

    /* ── Stats ── */
    .stats-bar {
      padding: 6px 1rem;
      font-size: 12px;
      color: var(--text-muted);
      background: var(--page-bg);
      border-bottom: 1px solid var(--border);
    }

    /* ── Grid ── */
    .species-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 1rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    @media (min-width: 480px) {
      .species-grid { grid-template-columns: repeat(3, 1fr); gap: 12px; }
    }
    @media (min-width: 768px) {
      .species-grid { grid-template-columns: repeat(4, 1fr); padding: 1.25rem; }
    }
    @media (min-width: 1024px) {
      .species-grid { grid-template-columns: repeat(5, 1fr); }
    }

    /* ── Card ── */
    .card {
      background: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
    }
    .card:hover {
      border-color: var(--primary-mid);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(30,46,36,0.12);
    }
    .card:active { transform: translateY(0); }

    .card-img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: contain;
      display: block;
      background: #f2f7f4;
      padding: 6px;
    }
    .card-placeholder {
      width: 100%;
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(22px, 4vw, 30px);
      font-weight: 500;
      color: rgba(255,255,255,0.88);
    }
    .ph-native     { background: #3d7a52; }
    .ph-introduced { background: #8b7020; }
    .ph-invasive   { background: #8c3422; }

    .card-body { padding: 8px 10px 11px; }
    .card-badges { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 5px; }

    .badge {
      font-size: 9px;
      padding: 2px 7px;
      border-radius: 20px;
      font-weight: 500;
      white-space: nowrap;
      line-height: 1.5;
    }
    .b-native     { background: var(--nat-light); color: var(--nat-dark); }
    .b-introduced { background: var(--int-light); color: var(--int-dark); }
    .b-invasive   { background: var(--inv-light); color: var(--inv-dark); }
    .b-endemic    { background: var(--end-light); color: var(--end-dark); }

    .card-name { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
    .card-sci  { font-size: 9.5px; font-style: italic; color: var(--text-muted); line-height: 1.35; margin-bottom: 3px; }
    .card-size { font-size: 10px; color: var(--text-sec); }

    /* ── Modal ── */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(14,30,20,0.6);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
    }
    .modal-backdrop.open { display: flex; }

    @media (min-width: 600px) {
      .modal-backdrop {
        align-items: center;
        padding: 1rem;
      }
    }

    .modal {
      background: var(--card-bg);
      border-radius: 16px 16px 0 0;
      width: 100%;
      max-width: 580px;
      max-height: 88vh;
      overflow-y: auto;
      animation: slideUp 0.22s ease;
      -webkit-overflow-scrolling: touch;
    }
    @media (min-width: 600px) {
      .modal {
        border-radius: 14px;
        max-height: 82vh;
      }
    }
    @keyframes slideUp {
      from { transform: translateY(24px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    /* 手機上方的拖曳把手提示 */
    .modal-handle {
      width: 36px; height: 4px;
      background: rgba(0,0,0,0.15);
      border-radius: 2px;
      margin: 10px auto 0;
    }
    @media (min-width: 600px) { .modal-handle { display: none; } }

    .modal-header {
      background: var(--primary);
      padding: 1rem 1.25rem 1rem;
      color: white;
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 0.9rem; right: 1rem;
      background: rgba(255,255,255,0.15);
      border: none;
      color: white;
      border-radius: 50%;
      width: 32px; height: 32px;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-family: inherit;
      transition: background 0.15s;
      touch-action: manipulation;
    }
    .modal-close:hover { background: rgba(255,255,255,0.28); }

    .modal-name { font-size: clamp(18px, 4vw, 24px); font-weight: 500; margin-bottom: 2px; padding-right: 40px; }
    .modal-sci  { font-style: italic; font-size: 13px; color: rgba(255,255,255,0.7); margin-bottom: 8px; }
    .modal-badges { display: flex; gap: 5px; flex-wrap: wrap; }
    .modal-badge-ghost {
      font-size: 10px;
      padding: 2px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.35);
      color: rgba(255,255,255,0.9);
    }

    .modal-img {
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      display: block;
      background: #f2f7f4;
      padding: 14px;
    }
    @media (min-width: 600px) { .modal-img { max-height: 320px; } }

    .modal-body { padding: 1rem 1.25rem 1.75rem; }

    .modal-aliases {
      font-size: 13px;
      color: var(--text-sec);
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .modal-aliases em { color: var(--text-muted); font-style: normal; font-size: 12px; }

    .modal-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .meta-chip {
      font-size: 12px;
      color: var(--text-sec);
      background: var(--page-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px 12px;
    }

    .modal-desc { font-size: 14.5px; color: var(--text); line-height: 1.85; }

    /* ── Empty ── */
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* ── Footer ── */
    .site-footer {
      background: var(--primary);
      color: rgba(255,255,255,0.6);
      text-align: center;
      padding: 1.75rem 1rem;
      font-size: 12px;
      margin-top: 2rem;
      line-height: 2;
    }
    .site-footer strong { color: rgba(255,255,255,0.9); font-weight: 500; }
  </style>
</head>
<body>

<!-- ── Hero Banner ── -->
<div class="hero">
  <div class="hero-overlay">
    <p class="hero-eyebrow">Dapo Pond · Chishang · Taitung</p>
    <h1 class="hero-title">大坡池水生生物圖鑑</h1>
    <p class="hero-sub">臺東縣池上鄉 · 認識這片濕地的生命</p>
  </div>
</div>

<div class="intro">
  大坡池位於臺東縣池上鄉，是台灣東部重要的天然淡水濕地，<br>
  豐富的水生植物與開闊的水面，孕育了多樣的魚類、蝦類與貝螺。
</div>

<!-- ── Filter Bar ── -->
<div class="filter-bar">
  <div class="filter-row">
    <span class="filter-label">來源</span>
    <button class="fbtn on"  onclick="setCat('all',this)">全部</button>
    <button class="fbtn"     onclick="setCat('native',this)">原生種 <small>17</small></button>
    <button class="fbtn"     onclick="setCat('introduced',this)">外來原生種 <small>6</small></button>
    <button class="fbtn"     onclick="setCat('invasive',this)">外來種 <small>7</small></button>
  </div>
  <div class="filter-row">
    <span class="filter-label">類群</span>
    <button class="fbtn on"  onclick="setType('all',this)">全部</button>
    <button class="fbtn"     onclick="setType('fish',this)">魚類</button>
    <button class="fbtn"     onclick="setType('shrimp',this)">蝦類</button>
    <button class="fbtn"     onclick="setType('mollusk',this)">貝螺類</button>
  </div>
</div>

<div class="stats-bar" id="stats">顯示全部 30 種</div>
<div class="species-grid" id="grid"></div>

<!-- ── Modal ── -->
<div class="modal-backdrop" id="backdrop" onclick="onBackdropClick(event)">
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <div class="modal-header" id="modal-header">
      <button class="modal-close" onclick="closeModal()" aria-label="關閉">×</button>
      <p class="modal-name"   id="modal-name"></p>
      <p class="modal-sci"    id="modal-sci"></p>
      <div class="modal-badges" id="modal-badges"></div>
    </div>
    <img class="modal-img" id="modal-img" src="" alt=""
         onerror="this.style.display='none'">
    <div id="modal-img2-wrap" style="display:none; padding: 0 1.25rem 0.5rem; background:#f2f7f4;">
      <p style="font-size:11px;color:#7a9485;padding:8px 0 4px;letter-spacing:1px;">卵塊特寫</p>
      <img id="modal-img2" src="" alt="卵塊"
           style="width:100%;max-height:200px;object-fit:contain;border-radius:8px;background:#fff;"
           onerror="this.parentElement.style.display='none'">
    </div>
    <div class="modal-body">
      <div class="modal-aliases" id="modal-aliases"></div>
      <div class="modal-meta"    id="modal-meta"></div>
      <p   class="modal-desc"   id="modal-desc"></p>
    </div>
  </div>
</div>

<!-- ── Footer ── -->
<footer class="site-footer">
  <strong>大坡池水生生物圖鑑</strong><br>
  臺東縣池上鄉環境教育資源 · 物種資料來源：現場生態調查記錄
</footer>

<script>
const CAT_LABEL = { native:'原生種', introduced:'外來原生種', invasive:'外來種' };
const CAT_CLASS = { native:'b-native', introduced:'b-introduced', invasive:'b-invasive' };
const CAT_PH    = { native:'ph-native', introduced:'ph-introduced', invasive:'ph-invasive' };
const CAT_HDR   = { native:'#2c5f3f', introduced:'#7a5c14', invasive:'#7c2e18' };
const TYPE_LABEL = { fish:'魚類', shrimp:'蝦類', mollusk:'貝螺類' };

const SPECIES = [
  /* ── 原生種 魚類 ── */
  { id:1,  name:'高體鰟鮍',   sci:'Rhodeus ocellatus ocellatus',
    aliases:'牛屎鯽、鱊、紅目鯽仔、水打扁',
    cat:'native', type:'fish', size:'至 6 cm', endemic:false, img:'高體鰟鮍.jpg',
    desc:'身體側扁且高，雄魚顏色鮮豔，有著七彩金屬光澤，雌魚體色較素，呈銀灰色，並在繁殖期長出細長的「產卵管」。與河蚌有共生關係，雌魚將卵產入河蚌的鰓腔中，幼魚也在其中發育，是大坡池生態中相當獨特的繁殖策略。' },
  { id:2,  name:'臺灣石鮒',   sci:'Paratanakia himantegus',
    aliases:'牛屎鯽、革條田中鰟鮍、副彩鮮鱊',
    cat:'native', type:'fish', size:'至 8 cm', endemic:true, img:'台灣石鮒.jpg',
    desc:'台灣特有種。身體長而側扁，體側有一條從尾部延伸向前的深色縱帶，雄魚顏色鮮豔，身體後段帶有顯眼的橘紅色，雌魚體色較素。與河蚌有共生關係，繁殖方式與高體鰟鮍相似。' },
  { id:3,  name:'菊池氏細鯽', sci:'Aphyocypris kikuchii',
    aliases:'禾花仔、madaka、田溝魚、便當魚',
    cat:'native', type:'fish', size:'至 8 cm', endemic:true, img:'菊池氏細鯽.jpg',
    desc:'台灣特有種。身體為淺黃褐色，成魚體側有一灰藍色的縱帶。別名與稻田相關，顯示菊池氏細鯽與稻田的緊密關係，早期也是便當裡的一道菜色，因此又稱為便當魚。' },
  { id:4,  name:'羅漢魚',     sci:'Pseudorasbora parva',
    aliases:'尖嘴仔、車栓仔、麥穗魚',
    cat:'native', type:'fish', size:'至 11 cm', endemic:false, img:'羅漢魚.jpg',
    desc:'體型小巧，最大特徵是嘴巴小而尖，口裂向上傾斜，因而有「尖嘴仔」之稱。體色銀灰，體側有一條較深的縱紋，於繁殖期時有護卵的行為。' },
  { id:5,  name:'鯽',         sci:'Carassius auratus auratus',
    aliases:'鯽仔、土鯽',
    cat:'native', type:'fish', size:'至 32 cm', endemic:false, img:'鯽.jpg',
    desc:'體型圓潤，體色銀灰略帶金屬光澤，背部弓起明顯，側線完整清晰。嘴巴小而無鬚，可與鯉魚（有兩對鬚）輕鬆區分。雜食性魚類，以植物碎片、藻類、底棲甲殼類為食。' },
  { id:6,  name:'鯉',         sci:'Cyprinus carpio carpio',
    aliases:'',
    cat:'native', type:'fish', size:'至 110 cm', endemic:false, img:'鯉.jpg',
    desc:'身體肥厚，背部微微突起，有鬚兩對，體背部暗灰色或黃褐色，側面略帶黃綠色。雜食性，以小型動物為主食。因產肉率高，可作為食用魚。' },
  { id:7,  name:'何氏棘魞',   sci:'Spinibarbus hollandi',
    aliases:'捲仔',
    cat:'native', type:'fish', size:'至 60 cm', endemic:true, img:'何氏棘魞.jpg',
    desc:'台灣特有種，東部原生魚類，在台灣西部為外來種。體背青灰色，腹部銀白色，全身覆蓋大型圓鱗，體側鱗片基部有一黑斑，胸鰭與腹鰭呈橘紅色。泳速快，好跳出水面捕食昆蟲。' },
  { id:8,  name:'高身白甲魚', sci:'Onychostoma alticorpus',
    aliases:'鮸仔、高身鯝魚',
    cat:'native', type:'fish', size:'至 50 cm', endemic:true, img:'高身白甲魚.jpg',
    desc:'台灣特有種，曾被列入保育類。身體高而隆起，頭小且短圓，嘴巴朝下，體色銀白色，體背部為青綠色，胸、腹、臀鰭鰭膜為粉紅色。以附著於石頭上的藻類為主食，也吃水生昆蟲。' },
  { id:9,  name:'鯔',         sci:'Mugil cephalus',
    aliases:'烏魚、信魚',
    cat:'native', type:'fish', size:'至 100 cm', endemic:false, img:'鯔.jpg',
    desc:'洄游性魚類，每年冬至過後，會洄游南下產卵，而經過臺灣海峽。廣鹽性魚類，在海水、半淡鹹水、淡水水域皆可存活，會隨著成長而游向外洋。暗灰色的背部、銀白色的身體，側面有數條黑灰色帶。' },
  { id:10, name:'鯰',         sci:'Silurus asotus',
    aliases:'鯰魚、念仔魚',
    cat:'native', type:'fish', size:'近 1 公尺', endemic:false, img:'鯰.jpg',
    desc:'大坡池體型最大的原生魚類之一。扁平的大頭、寬闊的嘴巴、口角兩側有兩對長鬚，全身無鱗，皮膚光滑。夜行性魚種，白天躲在草叢間或石縫洞穴中，夜間出來活動。肉食性，性兇猛而貪食，以其他小動物為食。' },
  { id:11, name:'極樂吻蝦虎', sci:'Rhinogobius similis',
    aliases:'苦甘仔、狗甘仔',
    cat:'native', type:'fish', size:'至 8 cm', endemic:false, img:'極樂吻蝦虎.jpg',
    desc:'頭部較大，眼睛圓而突出，腹鰭癒合成吸盤狀，臉部具有蠕蟲狀斑，背鰭與尾鰭有許多斑紋。具有兩種生活史，一種是陸封型，另一種是兩側洄游型。肉食性，以小型水中無脊椎動物、小魚等為食。' },
  /* ── 原生種 蝦類 ── */
  { id:12, name:'粗糙沼蝦',   sci:'Macrobrachium asperulum',

let curCat = 'all', curType = 'all';

function catBadgeClass(cat) {
  return { native:'b-native', introduced:'b-introduced', invasive:'b-invasive' }[cat];
}

function renderGrid() {
  const list = SPECIES.filter(s =>
    (curCat  === 'all' || s.cat  === curCat) &&
    (curType === 'all' || s.type === curType)
  );
  document.getElementById('stats').textContent =
    `顯示 ${list.length} 種（共 30 種）`;
  const grid = document.getElementById('grid');
  if (!list.length) {
    grid.innerHTML = '<p class="empty">此篩選條件下無物種資料</p>';
    return;
  }
  grid.innerHTML = list.map(s => {
    const imgTag = s.img
      ? `<img class="card-img" src="${s.img}" alt="${s.name}" loading="lazy"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
      : '';
    const phStyle = s.img ? 'display:none' : '';
    const ph = `<div class="card-placeholder ${CAT_PH[s.cat]}" style="${phStyle}">${s.name.charAt(0)}</div>`;
    return `<div class="card" onclick="openModal(${s.id})">
      ${imgTag}${ph}
      <div class="card-body">
        <div class="card-badges">
          <span class="badge ${catBadgeClass(s.cat)}">${CAT_LABEL[s.cat]}</span>
          ${s.endemic ? '<span class="badge b-endemic">特有種</span>' : ''}
        </div>
        <p class="card-name">${s.name}</p>
        <p class="card-sci">${s.sci}</p>
        <p class="card-size">體長 ${s.size}</p>
      </div>
    </div>`;
  }).join('');
}

function openModal(id) {
  const s = SPECIES.find(x => x.id === id);
  document.getElementById('modal-name').textContent = s.name;
  document.getElementById('modal-sci').textContent  = s.sci;
  document.getElementById('modal-header').style.background = CAT_HDR[s.cat];

  document.getElementById('modal-badges').innerHTML = `
    <span class="modal-badge-ghost">${CAT_LABEL[s.cat]}</span>
    ${s.endemic ? '<span class="modal-badge-ghost">台灣特有種</span>' : ''}
  `;

  const img = document.getElementById('modal-img');
  if (s.img) {
    img.src = s.img; img.alt = s.name; img.style.display = 'block';
  } else {
    img.style.display = 'none';
  }

  const img2wrap = document.getElementById('modal-img2-wrap');
  if (s.img2) {
    document.getElementById('modal-img2').src = s.img2;
    img2wrap.style.display = 'block';
  } else {
    img2wrap.style.display = 'none';
  }

  document.getElementById('modal-aliases').innerHTML = s.aliases
    ? `<em>別名：</em>${s.aliases}`
    : '<em>暫無別名記錄</em>';

  document.getElementById('modal-meta').innerHTML = `
    <span class="meta-chip">類群：${TYPE_LABEL[s.type]}</span>
    <span class="meta-chip">體長：${s.size}</span>
  `;

  document.getElementById('modal-desc').textContent = s.desc;
  document.getElementById('backdrop').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('backdrop').classList.remove('open');
  document.body.style.overflow = '';
}

function onBackdropClick(e) {
  if (e.target === document.getElementById('backdrop')) closeModal();
}

function setCat(cat, btn) {
  curCat = cat;
  document.querySelectorAll('.filter-row:first-child .fbtn').forEach(b => b.className = 'fbtn');
  btn.className = 'fbtn ' + (cat === 'introduced' ? 'on-int' : cat === 'invasive' ? 'on-inv' : 'on');
  renderGrid();
}

function setType(type, btn) {
  curType = type;
  document.querySelectorAll('.filter-row:last-child .fbtn').forEach(b => b.className = 'fbtn');
  btn.className = 'fbtn on';
  renderGrid();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

renderGrid();
</script>
